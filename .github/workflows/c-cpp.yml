name: C/C++ CI

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build-linux:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: make build directory
      run: mkdir build
    - name: configure
      working-directory: ./build
      run: cmake ..
    - name: compile
      working-directory: ./build
      run: make
    - name: test
      working-directory: ./in
      run: test
