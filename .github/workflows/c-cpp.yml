name: C/C++ CI

on:
  pull_request:
    branches: [ "main" ]

jobs:
  test-linux:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: make build directory
      run: mkdir build
    - name: configure
      working-directory: ./build
      run: cmake ..
    - name: compile
      working-directory: ./build
      run: cmake --build .
    - name: test
      working-directory: ./bin
      run: ./test

  test-windows:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v6
    - name: make build directory
      run: mkdir build
    - name: configure
      working-directory: ./build
      run: cmake .. --preset windows
    - name: compile
      working-directory: ./build
      run: cmake --build .
    - name: test
      working-directory: ./bin
      run: test
