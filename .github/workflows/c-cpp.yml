name: C/C++ CI

on:
  pull_request:
    branches: [ "main" ]

jobs:
  test-linux:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: make build directory
      run: mkdir build
    - name: configure
      working-directory: ./build
      run: cmake ..
    - name: compile
      working-directory: ./build
      run: cmake --build .
    - name: test
      working-directory: ./bin
      run: ./test

  test-windows:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v6
    - name: install msys2
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        location: C:\
    - name: install gcc
      shell: msys2 {0}
      run: pacman -S --needed base-devel mingw-w64-ucrt-x86_64-toolchain --noconfirm
    - name: verify gcc installation
      run: |
        gcc --version
    - name: make build directory
      run: mkdir build
    - name: configure
      working-directory: ./build
      run: cmake .. --preset windows
    - name: compile
      working-directory: ./build
      run: cmake --build .
    - name: test
      working-directory: ./bin
      run: test
